<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ css_version }}">
</head>
<body>
  <header>
    <a class="brand" href="/{% if lang == 'en' %}?lang=en{% endif %}"><strong>{{ app_name }}</strong></a>
    <div class="header-right">
      <nav class="lang" aria-label="{{ t.lang_label }}">
        {% if lang == "cs" %}
          <a href="{{ request.url.path }}?lang=en">{{ t.lang_en }}</a>
        {% else %}
          <a href="{{ request.url.path }}?lang=cs">{{ t.lang_cs }}</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    {{ t.footer }}
    · <a href="/privacy{% if lang == 'en' %}?lang=en{% endif %}">{{ t.privacy_link }}</a>
    · <a href="{{ github_url }}" rel="noopener" target="_blank">{{ t.github }}</a>
  </footer>
  <script>
    (function () {
      var lang = document.documentElement.lang === "en" ? "en-GB" : "cs-CZ";
      document.querySelectorAll("time.js-local-time[datetime]").forEach(function (el) {
        var d = new Date(el.getAttribute("datetime"));
        if (isNaN(d.getTime())) return;
        el.textContent = d.toLocaleString(lang, {
          day: "numeric",
          month: lang === "en-GB" ? "short" : "numeric",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZoneName: "short"
        });
      });
    })();
  </script>
</body>
</html>
