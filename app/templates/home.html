{% extends "base.html" %}
{% block content %}
  <div class="toolbar">
    <div>
      <h1>{{ t.overview }}</h1>
      <p class="lead">{{ user.email }}</p>
    </div>
    <nav>
      <a class="button ghost" href="/settings">{{ t.settings }}</a>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="ghost" type="submit">{{ t.logout }}</button>
      </form>
    </nav>
  </div>

  <div class="card">
    <p>{{ t.overview_ok }}</p>
  </div>
{% endblock %}
