{% extends "base.html" %}
{% block title %}{{ t.verify_title }} · {{ app_name }}{% endblock %}
{% block content %}
  <h1>{{ t.verify_title }}</h1>
  <p class="lead">{{ t.verify_lead }}</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login/verify" class="card">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="code">{{ t.code_label }}</label>
    <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code">
    <button type="submit">{{ t.verify_submit }}</button>
  </form>
{% endblock %}
