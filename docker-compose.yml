# Secrets live in .env next to this file on the NAS, not in git.
# Image is built by GitHub Actions and pulled here — do not Build in Container Manager.

services:
  zepplox:
    image: ghcr.io/pjanecekatlangmaster/zepplox:latest
    container_name: zepplox
    network_mode: bridge
    ports:
      - "8456:8456"
    env_file:
      - .env
    dns:
      - "8.8.8.8"
      - "1.1.1.1"
    restart: unless-stopped
